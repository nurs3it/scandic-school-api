# files.scandicschool.edu.kz — file storage for the API on Render.
# Included by gradeapp's nginx (copied to /opt/nginx-sites/scandic-files.conf, mounted at /etc/nginx/sites/;
# /opt/scandic-school/files at /srv/scandic-files). Port 80 and ACME
# challenges are handled by gradeapp's default server.
server {
    listen 443 ssl;
    server_name files.scandicschool.edu.kz;

    ssl_certificate     /etc/letsencrypt/live/files.scandicschool.edu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.scandicschool.edu.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/scandic-files;
    client_max_body_size 60m;  # attestation scans go up to 50 MB
    autoindex off;

    location / {
        # Anyone may read; only the API (basic auth) may upload or delete.
        limit_except GET HEAD {
            auth_basic "scandic files";
            auth_basic_user_file /etc/nginx/sites/scandic-files.htpasswd;
        }
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access group:r all:r;
        expires 30d;

        # Only known-safe types render in the browser; anything else (an .html
        # or .svg slipped past the upload check) is served as a download.
        types {
            application/pdf pdf;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            video/mp4 mp4;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;

        # ?download=<url-encoded name> → save under the original filename
        if ($arg_download) {
            add_header Content-Disposition "attachment; filename*=UTF-8''$arg_download";
        }
    }
}
